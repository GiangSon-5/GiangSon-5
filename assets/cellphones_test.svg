<svg width="480" height="295" viewBox="0 0 480 295" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f78166"/>
      <stop offset="100%" stop-color="#ff9e64"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9e64"/>
      <stop offset="100%" stop-color="#f78166"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background rect, rx=14 -->
  <rect width="480" height="295" rx="14" fill="url(#bg)"/>
  <!-- 2. Top accent bar: height=3, rx=2, fill=accent gradient -->
  <rect width="480" height="3" rx="2" fill="url(#accent)"/>
  <!-- 3. Outer border: stroke=#30363d, stroke-width=1 -->
  <rect width="480" height="295" rx="14" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- 4. HEADER -->
  <text x="20" y="42" font-size="16" font-family="monospace" fill="#8b949e">📱</text>
  <text x="44" y="42" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="url(#title)" filter="url(#glow)">cellphones-dwh-etl-pipeline</text>

  <!-- 5. Horizontal divider line #21262d -->
  <line x1="20" y1="54" x2="460" y2="54" stroke="#21262d" stroke-width="1"/>

  <!-- 6. DESCRIPTION -->
  <text x="20" y="76" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Ingests 5 raw retail streams (POS, Inventory, Stores, Products, Targets) for 170+ stores.</text>
  <text x="20" y="94" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Transforms data via Python ETL, computes DRR &amp; Cover Ratio, models SCD Type 2 DWH.</text>
  <text x="20" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8b949e">Delivers BigQuery Medallion Star Schema &amp; Power BI dashboards with DAX Virtual Tables.</text>

  <!-- 7. Horizontal divider line #21262d -->
  <line x1="20" y1="124" x2="460" y2="124" stroke="#21262d" stroke-width="1"/>

  <!-- 8. TECH STACK PILLS -->
  <rect x="20" y="136" width="55" height="20" rx="4" fill="rgba(86,211,100,0.1)" stroke="#56d364" stroke-width="1"/>
  <text x="28" y="150" font-family="monospace" font-size="11" fill="#56d364">Python</text>

  <rect x="83" y="136" width="55" height="20" rx="4" fill="rgba(121,192,255,0.1)" stroke="#79c0ff" stroke-width="1"/>
  <text x="91" y="150" font-family="monospace" font-size="11" fill="#79c0ff">Pandas</text>

  <rect x="146" y="136" width="68" height="20" rx="4" fill="rgba(163,113,247,0.1)" stroke="#a371f7" stroke-width="1"/>
  <text x="154" y="150" font-family="monospace" font-size="11" fill="#a371f7">BigQuery</text>

  <rect x="222" y="136" width="61" height="20" rx="4" fill="rgba(255,166,87,0.1)" stroke="#ffa657" stroke-width="1"/>
  <text x="230" y="150" font-family="monospace" font-size="11" fill="#ffa657">SQL DWH</text>

  <rect x="291" y="136" width="68" height="20" rx="4" fill="rgba(88,166,255,0.1)" stroke="#58a6ff" stroke-width="1"/>
  <text x="299" y="150" font-family="monospace" font-size="11" fill="#58a6ff">Power BI</text>

  <rect x="367" y="136" width="35" height="20" rx="4" fill="rgba(247,129,102,0.1)" stroke="#f78166" stroke-width="1"/>
  <text x="375" y="150" font-family="monospace" font-size="11" fill="#f78166">DAX</text>

  <!-- 9. Horizontal divider line #21262d -->
  <line x1="20" y1="166" x2="460" y2="166" stroke="#21262d" stroke-width="1"/>

  <!-- 10. KEY ATTRIBUTES (5 dòng cố định, font-size=11) -->
  <text x="20" y="186" font-family="monospace" font-size="11" fill="url(#accent)">▸</text>
  <text x="32" y="186" font-family="monospace" font-size="11" fill="#8b949e">Source</text>
  <text x="110" y="186" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">5 Raw CSV Streams (POS, Inventory, Store, Products)</text>

  <text x="20" y="204" font-family="monospace" font-size="11" fill="url(#accent)">▸</text>
  <text x="32" y="204" font-family="monospace" font-size="11" fill="#8b949e">Data Model</text>
  <text x="110" y="204" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Star Schema (3-Layer DWH) &amp; SCD Type 2</text>

  <text x="20" y="222" font-family="monospace" font-size="11" fill="url(#accent)">▸</text>
  <text x="32" y="222" font-family="monospace" font-size="11" fill="#8b949e">Pipeline</text>
  <text x="110" y="222" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Modular Python ETL &amp; Config-Driven Rule Engine</text>

  <text x="20" y="240" font-family="monospace" font-size="11" fill="url(#accent)">▸</text>
  <text x="32" y="240" font-family="monospace" font-size="11" fill="#8b949e">Test Suite</text>
  <text x="110" y="240" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Pytest (5 Automated Pipeline Unit Tests)</text>

  <text x="20" y="258" font-family="monospace" font-size="11" fill="url(#accent)">▸</text>
  <text x="32" y="258" font-family="monospace" font-size="11" fill="#8b949e">Results</text>
  <text x="110" y="258" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">100% POS Deduplication &amp; 380M+ VND Restored</text>

  <!-- 11. FOOTER -->
  <circle cx="20" cy="276" r="5" fill="#3572A5"/>
  <text x="30" y="280" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b949e">Python 70% • SQL &amp; DAX 30%</text>
</svg>
